name: Cadre editorial agent

on:
  schedule:
    # Monday, Wednesday, Friday at 07:00 UTC
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without uploading to Drive (still writes local draft artifacts)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: cadre-editorial
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cadre agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
          CADRE_DRAFT_MODEL: ${{ vars.CADRE_DRAFT_MODEL }}
          NEXT_PUBLIC_SITE_URL: https://www.twm.expert
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run cadre:run -- --dry-run
          else
            npm run cadre:run
          fi

      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadre-drafts-${{ github.run_id }}
          path: |
            content/cadre-drafts/**
            content/cadre-sources/**
          if-no-files-found: warn
          retention-days: 14
